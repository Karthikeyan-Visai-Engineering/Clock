<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Visai Engineering</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap');

    :root {
      --accent: #ffd86b;
      --text: hsl(0, 0%, 99%);
    }

    body {
      margin: 0;
      height: 100vh;
      font-family: "Orbitron", sans-serif;
      color: var(--text);
      background: url('/assets/earth.jpg') center/cover no-repeat fixed;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      perspective: 1000px;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: -1;
    }

    h1 {
      font-size: 4.5vmin;
      color: var(--accent);
      margin-bottom: 3vmin;
      text-shadow: 0 0 25px rgba(255,230,150,0.9);
      animation: fadeInDown 1.2s ease;
      text-align: center;
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-40px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ---- 3 columns x 2 rows grid ---- */
    .clock-grid {
      display: grid;
      grid-template-columns: repeat(3, 340px); /* Slightly reduced width to fit TV */
      gap: 5vmin;
      justify-content: center;
      align-items: center;
      max-width: 100vw; /* Ensure it doesn't overflow horizontally */
    }

    /* ---- 3D Card ---- */
    .clock-card {
      padding: 1vmin;
      text-align: center;
      border-radius: 2vmin;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.45);
      transform-style: preserve-3d;
      transition: 0.6s ease;
      animation: floaty 6s ease-in-out infinite;
    }

    @keyframes floaty {
      0%, 100% { transform: translateY(0) rotateY(0deg); }
      50%      { transform: translateY(-12px) rotateY(6deg); }
    }

    .clock-card:hover {
      transform: scale(1.05) rotateY(15deg);
      box-shadow: 0 25px 60px rgba(255,215,90,0.8);
    }

    .flag {
      width: 100px;
      height: 65px;
      border-radius: 10px;
      margin-bottom: 1.5vmin;
      border: 2px solid rgba(0,0,0,0.35);
      background: white;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }

    .city {
      font-size: 3vmin;
      font-weight: 700;
      color: #faf6f6;
      text-shadow: 0 0 4px rgba(255,255,255,0.8);
      margin-bottom: 0.8vmin;
    }

    .clock {
      font-size: 5.5vmin;
      font-weight: 800;
      text-shadow: 0 0 10px rgba(255,255,255,0.9);
      margin-bottom: 1vmin;
    }

    .date {
      font-size: 2vmin;
      color: #fcfbfb;
      opacity: 0.9;
      text-shadow: 0 0 5px rgba(255,255,255,0.7);
    }

    footer {
      margin-top: 3vmin;
      font-size: 2.2vmin;
      color: white;
      opacity: 0.85;
      animation: fadeInUp 1.5s ease;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(40px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Responsive adjustments for TV screens */
    @media (max-width: 1920px) {
      .clock-grid {
        grid-template-columns: repeat(3, 300px);
      }
      .clock-card {
        padding: 3vmin;
      }
      .flag {
        width: 120px;
        height: 90px;
      }
      .city { font-size: 2.6vmin; }
      .clock { font-size: 4.8vmin; }
      .date { font-size: 1.8vmin; }
    }
  </style>
</head>

<body>

  <h1>🌍 Visai Engineering</h1>

  <div class="clock-grid">

    <div class="clock-card" data-tz="Asia/Kolkata">
      <img class="flag" src="https://flagcdn.com/w320/in.png">
      <div class="city">India 🇮🇳</div>
      <div class="clock" id="clock0">--:--:--</div>
      <div class="date" id="date0">Loading...</div>
    </div>

    <div class="clock-card" data-tz="America/Edmonton">
      <img class="flag" src="https://flagcdn.com/w320/ca.png">
      <div class="city">Calgary — Canada 🇨🇦</div>
      <div class="clock" id="clock1">--:--:--</div>
      <div class="date" id="date1">Loading...</div>
    </div>

    <div class="clock-card" data-tz="America/Chicago">
      <img class="flag" src="https://flagcdn.com/w320/us.png">
      <div class="city">Central USA 🇺🇸</div>
      <div class="clock" id="clock2">--:--:--</div>
      <div class="date" id="date2">Loading...</div>
    </div>

    <div class="clock-card" data-tz="America/New_York">
      <img class="flag" src="https://flagcdn.com/w320/us.png">
      <div class="city">Eastern USA 🇺🇸</div>
      <div class="clock" id="clock3">--:--:--</div>
      <div class="date" id="date3">Loading...</div>
    </div>

    <div class="clock-card" data-tz="Europe/London">
      <img class="flag" src="https://flagcdn.com/w320/gb.png">
      <div class="city">United Kingdom 🇬🇧</div>
      <div class="clock" id="clock4">--:--:--</div>
      <div class="date" id="date4">Loading...</div>
    </div>

    <div class="clock-card" data-tz="Pacific/Auckland">
      <img class="flag" src="https://flagcdn.com/w320/nz.png">
      <div class="city">Auckland — New Zealand 🇳🇿</div>
      <div class="clock" id="clock5">--:--:--</div>
      <div class="date" id="date5">Loading...</div>
    </div>

  </div>

  <footer>⏱ Real-time Auto-updating • Visai Engineering</footer>

  <script>
    const cards = document.querySelectorAll(".clock-card");

    function updateClocks() {
      const now = new Date();

      cards.forEach((card, i) => {
        const tz = card.getAttribute("data-tz");

        const timeStr = now.toLocaleTimeString("en-US", {
          timeZone: tz,
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          hour12: false
        });

        const dateStr = now.toLocaleDateString("en-US", {
          timeZone: tz,
          weekday: "short",
          month: "short",
          day: "numeric",
          year: "numeric"
        });

        document.getElementById("clock" + i).textContent = timeStr;
        document.getElementById("date" + i).textContent = dateStr;
      });
    }

    setInterval(updateClocks, 1000);
    updateClocks();
  </script>

</body>
</html>
