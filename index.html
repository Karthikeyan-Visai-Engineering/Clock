<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Visai Engineering — World Clocks</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap');

    :root {
      --accent: #ffd86b;
      --text: #000;
    }

    body {
      margin: 0;
      height: 100vh;
      font-family: "Orbitron", sans-serif;
      color: var(--text);
      background: url('/assets/earth.jpg') center/cover no-repeat;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      z-index: -1;
    }

    h1 {
      font-size: 4vmin;
      color: var(--accent);
      margin-bottom: 3vmin;
      text-align: center;
    }

    /* Updated GRID to 3×2 layout */
    .clock-grid {
  display: grid;
  grid-template-columns: repeat(3, 350px);
  gap: 5.5vmin;
  justify-content: center;
}

.clock-card {
  width: 350px;
  height: 260px;     /* FIXED HEIGHT — SAME FOR ALL */
  background: rgba(255, 255, 255, 0.75);
  padding: 2vmin;
  border-radius: 2vmin;
  text-align: center;
  box-shadow: 0 25px 40px rgba(0, 0, 0, 0.5);
  display: flex;
  flex-direction: column;
  justify-content: center;
  transition: 0.4s;
}

.clock-card:hover {
  transform: scale(1.06);
  box-shadow: 0 25px 60px rgba(255, 220, 120, 0.6);
}

.flag {
  width: 80px;
  height: 55px;
  border-radius: 8px;
  margin: 0 auto 0.5vmin auto;
  border: 2px solid rgba(0, 0, 0, 0.3);
}

.city {
  font-size: 2.2vmin;
  font-weight: 700;
  margin-bottom: 0.5vmin;
}

.clock {
  font-size: 4.8vmin;
  font-weight: 800;
  margin-bottom: 0.8vmin;
}

.date {
  font-size: 1.8vmin;
  opacity: 0.9;
}
    footer {
      margin-top: 4vmin;
      color: #fff;
      opacity: 0.9;
      font-size: 2vmin;
    }
  </style>
</head>

<body>

  <h1>🌍 World Digital Clocks — Visai Engineering</h1>

  <div class="clock-grid">

    <!-- India -->
    <div class="clock-card" data-tz="Asia/Kolkata">
      <img class="flag" src="https://flagcdn.com/w320/in.png">
      <div class="city">India 🇮🇳</div>
      <div class="clock" id="clock0">--:--:--</div>
      <div class="date" id="date0">Loading...</div>
    </div>

    <!-- Canada Calgary -->
    <div class="clock-card" data-tz="America/Edmonton">
      <img class="flag" src="https://flagcdn.com/w320/ca.png">
      <div class="city">Calgary — Canada 🇨🇦</div>
      <div class="clock" id="clock1">--:--:--</div>
      <div class="date" id="date1">Loading...</div>
    </div>

    <!-- Central US -->
    <div class="clock-card" data-tz="America/Chicago">
      <img class="flag" src="https://flagcdn.com/w320/us.png">
      <div class="city">Central US 🇺🇸</div>
      <div class="clock" id="clock2">--:--:--</div>
      <div class="date" id="date2">Loading...</div>
    </div>

    <!-- Eastern US -->
    <div class="clock-card" data-tz="America/New_York">
      <img class="flag" src="https://flagcdn.com/w320/us.png">
      <div class="city">Eastern US 🇺🇸</div>
      <div class="clock" id="clock3">--:--:--</div>
      <div class="date" id="date3">Loading...</div>
    </div>

    <!-- UK London (NEW)  -->
    <div class="clock-card" data-tz="Europe/London">
      <img class="flag" src="https://flagcdn.com/w320/gb.png">
      <div class="city">United Kingdom 🇬🇧</div>
      <div class="clock" id="clock4">--:--:--</div>
      <div class="date" id="date4">Loading...</div>
    </div>
    
     <!-- Auckland  -->
    <!-- Auckland — New Zealand -->
<div class="clock-card" data-tz="Pacific/Auckland">
  <img class="flag" src="https://flagcdn.com/w320/nz.png">
  <div class="city">Auckland — New Zealand 🇳🇿</div>
  <div class="clock" id="clock5">--:--:--</div>
  <div class="date" id="date5">Loading...</div>
</div>

  

  <script>
    const cards = document.querySelectorAll(".clock-card");

    function updateClocks() {
      const now = new Date();
      cards.forEach((card, i) => {
        const tz = card.getAttribute("data-tz");

        const timeStr = now.toLocaleTimeString("en-US", {
          timeZone: tz,
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          hour12: false
        });

        const dateStr = now.toLocaleDateString("en-US", {
          timeZone: tz,
          weekday: "short",
          month: "short",
          day: "numeric",
          year: "numeric"
        });

        document.getElementById("clock" + i).textContent = timeStr;
        document.getElementById("date" + i).textContent = dateStr;
      });
    }

    setInterval(updateClocks, 1000);
    updateClocks();
  </script>

</body>
</html>
